[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "plcyard"
version = "0.1.0"
description = "Free, open-source PLC trainer: write ladder logic, run it on simulated machines, and check your work."
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "plcyard/ui/assets/fonts/OFL-*.txt"]
authors = [{ name = "Julio Rodriguez" }]
requires-python = ">=3.11"
dependencies = ["PySide6>=6.6"]
keywords = ["plc", "ladder logic", "simulator", "automation", "education", "slc 500"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Education",
    "Intended Audience :: Education",
]

[project.urls]
Homepage = "https://juliordz.com"

[project.gui-scripts]
plcyard = "plcyard.__main__:main"

[tool.setuptools.packages.find]
include = ["plcyard*"]

[tool.setuptools.package-data]
plcyard = ["ui/assets/**/*", "data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
